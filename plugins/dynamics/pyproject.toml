[project]
name = "pymss-plugin-dynamics"
version = "0.1.0"
description = "pymss plugin: dynamics processing (pedalboard)"
requires-python = ">=3.10"
dependencies = ["pedalboard"]

[project.entry-points."pymss.plugins"]
dynamics = "dynamics"

[tool.pymss.plugin]
id = "pymss.dynamics"
api_version = 1

[[tool.pymss.plugin.contributions.nodes]]
type = "DynamicsCompressor"
title = "Compressor"
category = "pymss/plugins"
description = "Compressor (audio -> audio)"
inputs = [
  { name = "audio", type = "AUDIO" },
]
outputs = [
  { name = "audio", type = "AUDIO" },
]
widgets = [
  { name = "threshold_db", type = "number", default = 0.0, min = -60.0, max = 0.0, step = 0.5 },
  { name = "ratio", type = "number", default = 4.0, min = 1.0, max = 20.0, step = 0.5 },
  { name = "attack_ms", type = "number", default = 1.0, min = 0.1, max = 100.0, step = 0.1 },
  { name = "release_ms", type = "number", default = 100.0, min = 1.0, max = 1000.0, step = 1.0 }
]

[[tool.pymss.plugin.contributions.nodes]]
type = "DynamicsLimiter"
title = "Limiter"
category = "pymss/plugins"
description = "Limiter (audio -> audio)"
inputs = [
  { name = "audio", type = "AUDIO" },
]
outputs = [
  { name = "audio", type = "AUDIO" },
]
widgets = [
  { name = "threshold_db", type = "number", default = -3.0, min = -24.0, max = 0.0, step = 0.5 },
  { name = "release_ms", type = "number", default = 100.0, min = 1.0, max = 1000.0, step = 1.0 }
]

[[tool.pymss.plugin.contributions.nodes]]
type = "DynamicsDeEsser"
title = "De-esser"
category = "pymss/plugins"
description = "De-esser (audio -> audio)"
inputs = [
  { name = "audio", type = "AUDIO" },
]
outputs = [
  { name = "audio", type = "AUDIO" },
]
widgets = [
  { name = "threshold_db", type = "number", default = 0.0, min = -60.0, max = 0.0, step = 0.5 },
  { name = "ratio", type = "number", default = 3.0, min = 1.0, max = 10.0, step = 0.5 },
  { name = "crossover_hz", type = "number", default = 6000.0, min = 2000.0, max = 12000.0, step = 100.0 }
]
