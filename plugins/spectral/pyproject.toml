[project]
name = "pymss-plugin-spectral"
version = "0.1.0"
description = "pymss plugin: parametric EQ and filters (scipy biquad)"
requires-python = ">=3.10"
dependencies = ["scipy"]

[project.entry-points."pymss.plugins"]
spectral = "spectral"

[tool.pymss.plugin]
id = "pymss.spectral"
api_version = 1

[[tool.pymss.plugin.contributions.nodes]]
type = "SpectralHighpass"
title = "Highpass Filter"
category = "pymss/plugins"
description = "Highpass Filter (audio -> audio)"
inputs = [
  { name = "audio", type = "AUDIO" },
]
outputs = [
  { name = "audio", type = "AUDIO" },
]
widgets = [
  { name = "cutoff_hz", type = "number", default = 80.0, min = 10.0, max = 2000.0, step = 1.0 },
  { name = "Q", type = "number", default = 0.707, min = 0.1, max = 8.0, step = 0.001 }
]

[[tool.pymss.plugin.contributions.nodes]]
type = "SpectralLowpass"
title = "Lowpass Filter"
category = "pymss/plugins"
description = "Lowpass Filter (audio -> audio)"
inputs = [
  { name = "audio", type = "AUDIO" },
]
outputs = [
  { name = "audio", type = "AUDIO" },
]
widgets = [
  { name = "cutoff_hz", type = "number", default = 8000.0, min = 100.0, max = 20000.0, step = 1.0 },
  { name = "Q", type = "number", default = 0.707, min = 0.1, max = 8.0, step = 0.001 }
]

[[tool.pymss.plugin.contributions.nodes]]
type = "SpectralPeakEQ"
title = "Peak EQ"
category = "pymss/plugins"
description = "Peak EQ (audio -> audio)"
inputs = [
  { name = "audio", type = "AUDIO" },
]
outputs = [
  { name = "audio", type = "AUDIO" },
]
widgets = [
  { name = "center_hz", type = "number", default = 1000.0, min = 20.0, max = 20000.0, step = 1.0 },
  { name = "gain_db", type = "number", default = 0.0, min = -24.0, max = 24.0, step = 0.5 },
  { name = "Q", type = "number", default = 1.0, min = 0.1, max = 8.0, step = 0.01 }
]
