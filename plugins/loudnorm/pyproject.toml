[project]
name = "pymss-plugin-loudnorm"
version = "0.2.0"
description = "pymss plugin: LUFS loudness normalization"
requires-python = ">=3.10"
dependencies = [
    "pyloudnorm",
]

[project.entry-points."pymss.plugins"]
loudnorm = "loudnorm"

[tool.pymss.plugin]
id = "pymss.loudnorm"
api_version = 1

[[tool.pymss.plugin.contributions.nodes]]
type = "NormalizeLUFS"
title = "Normalize Loudness (LUFS)"
category = "pymss/plugins"
description = "LUFS integrated-loudness normalization (broadcast/streaming standard)"
inputs = [
  { name = "audio", type = "AUDIO" },
]
outputs = [
  { name = "audio", type = "AUDIO" },
]
widgets = [
  { name = "target_lufs", type = "number", default = -14.0, min = -70.0, max = -5.0, step = 0.5 },
]
